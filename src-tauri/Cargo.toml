[package]
name = "mcp-manager"
version = "0.1.0"
edition = "2024"
description = "Manage the MCP servers of Claude Desktop"
license = "MIT"
default-run = "mcp-manager"

[dependencies]
anyhow = "1.0.105"
base64 = "0.23.1"
chrono = "0.4.45"
minisign-verify = "0.3.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
ureq = { version = "3.5.2", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
winreg = "0.56.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
